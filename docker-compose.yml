# Despliegue del Sistema de Administración de Club (Entrega 4B, D-09):
#   nginx (proxy inverso, único puerto expuesto) -> club-app (Spring Boot + Vaadin) -> postgres (volumen persistente)
# Uso:   docker compose up --build        y abrir http://localhost:8080
# Solo la base (para ejecutar la aplicación localmente con ./mvnw spring-boot:run):
#        docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - datos-club:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 5s
      timeout: 5s
      retries: 20

  club-app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/club?currentSchema=club&stringtype=unspecified
      DB_USUARIO: club
      DB_CLAVE: club
      CLUB_URL_BASE: http://localhost:8080
      CLUB_CORREO_MODO: simulado
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./despliegue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - club-app

volumes:
  datos-club:
